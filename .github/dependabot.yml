version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node.js 24 is the supported runtime, so its type definitions stay on 24.x.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
